<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Perpustakaan Online SKAGA</title>

    <style>
        /* 🌌 BACKGROUND */
        body {
            font-family: 'Georgia', serif;
            margin: 0;
            background: radial-gradient(circle at top, #2b1055, #1a0f3c);
            overflow-x: hidden;
        }

        /* ✨ EFFECT BINTANG HALUS */
        body::after {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: url("https://www.transparenttextures.com/patterns/stardust.png");
            opacity: 0.3;
            z-index: -1;
        }

        /* CONTAINER */
        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        /* SEARCH */
        .search input {
            width: 93%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* GRID */
        #daftarBuku {
            display: grid;
            grid-template-columns: repeat(auto-fill, 170px);
            gap: 25px;
            margin-top: 25px;
        }

        /* ITEM */
        .book-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 📖 BUKU */
        .book-box {
            width: 160px;
            height: 220px;
            border-radius: 15px;
            overflow: hidden;
            background: linear-gradient(135deg, #4a6cff, #9d4edd);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: 0.4s;
            position: relative;
        }

        /* GLOW */
        .book-box::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            opacity: 0;
            transition: 0.4s;
        }

        .book-box:hover::before {
            opacity: 1;
        }

        /* HOVER FLOAT */
        .book-box:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 0 25px #c77dff;
        }

        /* COVER */
        .book-cover {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
        }

        /* 👑 BUTTON */
        .pinjam-btn {
            margin-top: 10px;
            padding: 7px 18px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(45deg, #ff9ecf, #c77dff);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        /* BUTTON HOVER */
        .pinjam-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px #ffb3ff;
        }

        /* ✨ JUDUL HALUS */
        h2 {
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px #c77dff;
        }
    </style>
</head>

<body>
    <a href="web6.html" style="
position:fixed;
top:20px;
left:20px;
text-decoration:none;
background:#4a6cff;
color:white;
padding:8px 16px;
border-radius:8px;">
        ⬅ Beranda
    </a>

    <div class="container">

        <div class="search">
            <input type="text" id="search" placeholder="Cari judul buku...">
        </div>

        <div id="daftarBuku"></div>

    </div>

    <script>

        const buku = [
            "Laskar Pelangi",
            "Bumi",
            "Atomic Habits",
            "Harry Potter",
            "Dilan 1990",
            "Sejarah Indonesia",
            "Fisika Dasar",
            "Laut Bercerita",
            "Act of Money",
            "Cantik Itu Luka",
            "Tetralogi Buru",
            "Sejarah Tuhan",
            "Gandaloka",
            "Madilog",
            "Salah Asuhan",
            "Pulang",
            "Gadis Pantai",
            "Semangkuk Mie Ayam Sebelum Mati",
            "Hujan",
            "Bumi Manusia"
        ];

        const daftar = document.getElementById("daftarBuku");
        const search = document.getElementById("search");

        function tampilkanBuku(filter = "") {
            daftar.innerHTML = "";

            buku.forEach(judul => {
                if (judul.toLowerCase().includes(filter.toLowerCase())) {

                    let item = document.createElement("div");
                    item.className = "book-item";

                    item.innerHTML = `
            <div class="book-box">
                <div class="book-cover">${judul}</div>
            </div>

            <button class="pinjam-btn"
            onclick="pinjam('${judul}')">
            Pinjam
            </button>
            `;

                    daftar.appendChild(item);
                }
            });
        }

        function pinjam(judul) {

            // ✨ efek klik halus
            document.body.style.opacity = "0.7";

            setTimeout(() => {
                window.location.href =
                    "Kartu peminjaman.html?buku=" + encodeURIComponent(judul);
            }, 200);
        }

        search.addEventListener("input", e => {
            tampilkanBuku(e.target.value);
        });

        tampilkanBuku();

    </script>

</body>

</html>
