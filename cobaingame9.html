<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Penjaga Rak Buku Nusantara</title>

    <style>
        /* 🌌 BACKGROUND */
        body {
            font-family: 'Georgia', serif;
            background: radial-gradient(circle at top, #2b1055, #140a2e);
            text-align: center;
            overflow-x: hidden;
        }

        /* ✨ BINTANG */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: url("https://www.transparenttextures.com/patterns/stardust.png");
            opacity: 0.3;
            z-index: -1;
        }

        /* 👑 JUDUL */
        h1,
        h2 {
            color: #fffede;
            text-shadow: 0 0 10px rgb(27, 54, 141), 0 0 30px #050962;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px gold;
            }

            to {
                text-shadow: 0 0 25px #0f1965, 0 0 40px #fff3b0;
            }
        }

        /* INFO */
        #info {
            color: #fff8dc;
            font-weight: bold;
            margin: 10px;
        }

        /* RAK */
        .container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        /* ✨ RAK KERAJAAN */
        .rak {
            width: 30%;
            min-height: 260px;
            border-radius: 20px;
            padding: 12px;

            background: #0d0f81;
            border: 3px solid gold;

            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.6),
                inset 0 0 10px rgba(255, 215, 0, 0.4);

            transition: 0.3s;
        }

        /* HOVER RAK */
        .rak:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px gold;
        }

        /* 📚 BUKU */
        .buku {
            width: 150px;
            height: 50px;
            margin: 8px auto;

            background: linear-gradient(135deg, #fcffd7, #fffd95);
            color: rgb(14, 8, 68);

            font-size: 12px;
            font-weight: bold;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: grab;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);

            transition: 0.3s;
            animation: float 3s ease-in-out infinite;
        }

        /* ✨ FLOAT LUCU */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* HOVER */
        .buku:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px #c77dff;
        }

        /* BENAR */
        .benar {
            background: linear-gradient(#b8ffb8, rgb(67, 165, 72)) !important;
            box-shadow: 0 0 15px #00ff88;
            cursor: default;
        }

        /* SALAH */
        .salah {
            animation: goyang 0.3s;
        }

        @keyframes goyang {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* AREA ITEM */
        #items {
            margin-top: 25px;
            min-height: 70px;
        }

        /* 👑 BUTTON EMAS */
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;

            background: linear-gradient(45deg, #d4af37, #ffd700);
            color: #4b2e05;

            border-radius: 15px;
            cursor: pointer;

            font-size: 16px;
            font-weight: bold;

            transition: 0.3s;
        }

        /* BUTTON HOVER */
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px gold;
        }

        /* PESAN */
        #pesan {
            font-size: 20px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <a href="web6.html" style="
position:fixed;
top:20px;
left:20px;
text-decoration:none;
background:#4a6cff;
color:white;
padding:8px 16px;
border-radius:8px;">
        ⬅ Beranda
    </a>

    <br>

    <h1>📚 Penjaga Rak Buku Nusantara 📚</h1>

    <div id="info">
        Level: <span id="level">1</span> |
        Skor: <span id="score">0</span> |
        Waktu: <span id="time">30</span>s
    </div>

    <div class="container">

        <div class="rak" data-rak="fiksi" ondrop="drop(event)" ondragover="allowDrop(event)">
            <h2>Rak Fiksi</h2>
        </div>

        <div class="rak" data-rak="nonfiksi" ondrop="drop(event)" ondragover="allowDrop(event)">
            <h2>Rak Non Fiksi</h2>
        </div>

        <div class="rak" data-rak="majalah" ondrop="drop(event)" ondragover="allowDrop(event)">
            <h2>Rak Majalah</h2>
        </div>

    </div>

    <h2>📦 Buku Datang</h2>
    <div id="items"></div>

    <p id="pesan"></p>

    <button onclick="startLevel()">🚀 Mulai / Lanjut Level</button>

    <script>

        let skor = 0;
        let level = 1;
        let waktu = 30;
        let timer;
        let bukuBenar = 0;
        let totalBuku = 0;

        const dataLevel = {

            1: [
                { nama: "Intisari", jenis: "majalah" },
                { nama: "Laut Bercerita", jenis: "fiksi" },
                { nama: "Bobo", jenis: "majalah" },
                { nama: "Laskar Pelangi", jenis: "fiksi" },
                { nama: "Kimia", jenis: "nonfiksi" },
                { nama: "Cantik Itu Luka", jenis: "fiksi" },
                { nama: "Biologi", jenis: "nonfiksi" },
                { nama: "Fisika", jenis: "nonfiksi" },
                { nama: "Cosmopolitan", jenis: "majalah" }
            ],

            2: [
                { nama: "ACT OF MONEY", jenis: "fiksi" },
                { nama: "Daulat Rakyat", jenis: "majalah" },
                { nama: "Madilog", jenis: "nonfiksi" },
                { nama: "Aksi Massa", jenis: "nonfiksi" },
                { nama: "BUMI", jenis: "fiksi" },
                { nama: "Soviet Indonesia", jenis: "majalah" },
                { nama: "Menuju Republik Indonesia", jenis: "nonfiksi" },
                { nama: "Indonesia Merdeka", jenis: "majalah" },
                { nama: "Tetralogi Buru", jenis: "fiksi" }
            ],

            3: [
                { nama: "Di Bawah Bendera Revolusi", jenis: "nonfiksi" },
                { nama: "Pulang", jenis: "fiksi" },
                { nama: "Het Vrije Woord", jenis: "majalah" },
                { nama: "Gadis Pantai", jenis: "fiksi" },
                { nama: "Di Bawah Bendera Revolusi", jenis: "nonfiksi" },
                { nama: "Salah Asuhan", jenis: "fiksi" },
                { nama: "Kuasa Kata", jenis: "nonfiksi" },
                { nama: "Pari", jenis: "majalah" },
                { nama: "Basis", jenis: "majalah" }
            ],

            4: [
                { nama: "Historia", jenis: "majalah" },
                { nama: "Bumi Manusia", jenis: "fiksi" },
                { nama: "Madilog", jenis: "nonfiksi" },
                { nama: "Perahu Kertas", jenis: "fiksi" },
                { nama: "Menuju Republik Indonesia", jenis: "nonfiksi" },
                { nama: "Aksi Massa", jenis: "nonfiksi" },
                { nama: "Kompas", jenis: "majalah" },
                { nama: "Hujan", jenis: "fiksi" },
                { nama: "Horison", jenis: "majalah" }
            ]

        };

        function resetRak() {

            document.querySelectorAll(".rak").forEach(rak => {
                const jenis = rak.dataset.rak;

                rak.innerHTML = `<h2>Rak ${jenis.charAt(0).toUpperCase() + jenis.slice(1)}</h2>`;

            });

        }

        function startLevel() {

            clearInterval(timer);

            resetRak();

            document.getElementById("items").innerHTML = "";

            bukuBenar = 0;

            totalBuku = dataLevel[level].length;

            waktu = 30;

            document.getElementById("time").innerText = waktu;
            document.getElementById("level").innerText = level;

            document.getElementById("pesan").innerHTML =
                "<span style='color:white'>Susun buku ke rak yang benar!</span>";

            dataLevel[level].forEach((item, i) => {

                const div = document.createElement("div");

                div.className = "buku";
                div.draggable = true;

                div.id = "buku" + level + "_" + i;

                div.dataset.jenis = item.jenis;

                div.ondragstart = drag;

                div.innerText = item.nama;

                document.getElementById("items").appendChild(div);

            });

            timer = setInterval(() => {

                waktu--;

                document.getElementById("time").innerText = waktu;

                if (waktu <= 0) {

                    clearInterval(timer);

                    document.getElementById("pesan").innerHTML =
                        "<span style='color:red'>⏰ Waktu habis!</span>";

                    alert("GAME OVER!");

                    document.querySelectorAll(".buku")
                        .forEach(b => b.draggable = false);

                }

            }, 1000);

        }

        function allowDrop(ev) {

            ev.preventDefault();

        }

        function drag(ev) {

            ev.dataTransfer.setData("text", ev.target.id);

        }

        function drop(ev) {

            ev.preventDefault();

            if (waktu <= 0) return;

            const id = ev.dataTransfer.getData("text");

            const buku = document.getElementById(id);

            if (!buku || buku.classList.contains("benar")) return;

            const jenisBuku = buku.dataset.jenis;

            const jenisRak = ev.currentTarget.dataset.rak;

            if (jenisBuku === jenisRak) {

                ev.currentTarget.appendChild(buku);

                buku.classList.add("benar");

                buku.draggable = false;

                skor += 10;

                bukuBenar++;

                document.getElementById("score").innerText = skor;

                document.getElementById("pesan").innerHTML =
                    "<span style='color:#00ff88'>✔ Benar!</span>";

                if (bukuBenar === totalBuku) {

                    clearInterval(timer);

                    setTimeout(() => {

                        level++;

                        if (dataLevel[level]) {

                            startLevel();

                        } else {

                            document.getElementById("pesan").innerHTML =
                                "<span style='color:gold'>🏆 Semua level selesai!</span>";

                        }

                    }, 1000);

                }

            } else {

                buku.classList.add("salah");

                setTimeout(() => {
                    buku.classList.remove("salah");
                }, 300);

                document.getElementById("pesan").innerHTML =
                    "<span style='color:#ff4444'>✖ Salah rak!</span>";

            }

        }

    </script>

</body>

</html>
