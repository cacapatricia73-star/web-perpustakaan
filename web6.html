<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan SKAGA</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* BACKGROUND */
        body {
            background: radial-gradient(circle at top, #2b1055, #140a2e);
            color: white;
        }

        /* CONTAINER */
        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-right: 2px solid gold;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* LOGO */
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 120px;
        }

        /* MENU */
        .menu a {
            display: block;
            padding: 12px;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .menu a:hover {
            background: linear-gradient(45deg, gold, #ffb347);
            color: #2b1055;
            box-shadow: 0 0 15px gold;
        }

        .menu .active {
            background: gold;
            color: #2b1055;
        }

        /* JAM */
        .jam {
            border: 1px solid gold;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SLIDER */
        .slider {
            width: 80%;
            max-width: 700px;
            height: 140px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin-bottom: 30px;
            border: 2px solid gold;
            box-shadow: 0 0 25px gold;
        }

        .slides {
            display: flex;
            height: 100%;
            transition: 0.5s;
        }

        .slide {
            flex: 0 0 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-family: 'Cinzel', serif;
            color: gold;
            text-shadow: 0 0 10px gold;
        }

        .slide1 {
            background: #1a0b3b;
        }

        .slide2 {
            background: #2b1055;
        }

        .slide3 {
            background: #140a2e;
        }

        /* DOT */
        .dots {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
        }

        .dot {
            height: 10px;
            width: 10px;
            margin: 4px;
            background: white;
            border-radius: 50%;
            display: inline-block;
            opacity: 0.5;
            cursor: pointer;
        }

        .dot.active {
            opacity: 1;
            background: gold;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 220px);
            gap: 25px;
        }

        /* BOX */
        .box {
            height: 200px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid gold;
            border-radius: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            font-size: 18px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        /* KILAU */
        .box::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shine 5s infinite;
        }

        @keyframes shine {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px gold;
            background: linear-gradient(45deg, #2b1055, #3a2370);
        }
    </style>

</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->
        <div class="sidebar">

            <div>

                <!-- LOGO -->
                <div class="logo">
                    <img src="logo sakga.png">
                    <!-- ganti logo.png dengan logo sekolah kamu -->
                </div>

                <!-- MENU -->
                <div class="menu">
                    <a class="active">Beranda</a>
                    <a href="peminjaman 5.html">Peminjaman Buku</a>
                    <a href="pengembalian buku.html">Pengembalian Buku</a>
                    <a href="cobaingame9.html">Game</a>
                    <a href="komentarPerpus.html">Komentar</a>
                    <a href="data peminjaman.html">Data Buku</a>
                </div>

            </div>

            <!-- JAM -->
            <div class="jam">
                <b>⏰ Jam Operasional</b><br><br>
                Senin–Kamis<br>
                07.00–15.00<br><br>
                Jumat<br>
                07.00–16.00
            </div>

        </div>

        <!-- MAIN -->
        <div class="main">

            <!-- SLIDER -->
            <div class="slider">

                <div class="slides" id="slides">
                    <div class="slide slide1">👑 PERPUSTAKAAN SKAGA</div>
                    <div class="slide slide2">📖 DUNIA ILMU PENGETAHUAN</div>
                    <div class="slide slide3">✨ BELAJAR ITU MENYENANGKAN</div>
                </div>

                <div class="dots">
                    <span class="dot active" onclick="pindahSlide(0)"></span>
                    <span class="dot" onclick="pindahSlide(1)"></span>
                    <span class="dot" onclick="pindahSlide(2)"></span>
                </div>

            </div>

            <!-- GRID -->
            <div class="grid">

                <div class="box" onclick="location.href='profil7.html'">Profil</div>
                <div class="box" onclick="location.href='layanan1.html'">Layanan</div>
                <div class="box" onclick="location.href='kolbuk7.html'">Koleksi Buku</div>
                <div class="box" onclick="location.href='tatibvisimisi4.html'">
                    Tata Tertib<br>&<br>Visi Misi
                </div>

            </div>

        </div>

    </div>

    <script>
        let index = 0;
        const slides = document.getElementById("slides");
        const dots = document.getElementsByClassName("dot");
        const total = dots.length;

        function tampilSlide(i) {
            index = i;
            slides.style.transform = "translateX(-" + index * 100 + "%)";

            for (let d = 0; d < total; d++) {
                dots[d].classList.remove("active");
            }
            dots[index].classList.add("active");
        }

        function pindahSlide(i) {
            tampilSlide(i);
        }

        setInterval(function () {
            index++;
            if (index >= total) index = 0;
            tampilSlide(index);
        }, 3000);
    </script>

</body>

</html>
